name: CI

on:
  pull_request:
  push:
    paths:
      - convert_flux/*
      - tests/*
    branches:
      - main

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    name: OS ${{ matrix.os }} with Python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest-cov

      - name: Build convert_flux
        run: pip install --no-cache-dir ".[dev]"

      - name: Test package
        run: python -m pytest --cov=convert_flux

      - name: Upload coverage reports to Codecov
        run: |
          # Replace `linux` below with the appropriate OS
          # Options are `alpine`, `linux`, `macos`, `windows`
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov --verbose upload-process --fail-on-error -t ${{ secrets.CODECOV_TOKEN }} -n 'service'-${{ github.run_id }} -F service -f coverage-service.xml