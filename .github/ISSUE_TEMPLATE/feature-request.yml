name: Feature Request
description: There is something I wish convert_flux had
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
- type: markdown
  attributes:
    value: |
      Thanks for thinking of this feature! Please make sure you have checked closed issues and fill out the following information:

- type: input
  attributes:
    label: "Version of `convert_flux`"
    placeholder: "XX.YY.ZZ"
  validations:
    required: true

- type: textarea
  id: task
  attributes:
    label: Task
    description: |
      Describe in a few sentences what the task is. We need to [...] in order
      to [...].
    placeholder: Describe the feature and the need it addresses.
  validations:
    required: true

- type: textarea
  id: acceptance
  attributes:
    label: Acceptance
    description: |
      Describe what must exist in order for the task to be considered done:
      code changes, specific/nonstandard testing expectations, documentation,
      or a follow-on task.
    placeholder: List the criteria that would make this feature complete.
  validations:
    required: true

- type: textarea
  id: details
  attributes:
    label: Details
    description: |
      Add any context that someone might need to get started, such as helpful
      links, code snippets, line numbers, or file names.
    placeholder: Add any other relevant context or implementation details.

- type: markdown
  attributes:
    value: Thanks again for filling out this feature request! We will respond with our ideas as soon as possible!
